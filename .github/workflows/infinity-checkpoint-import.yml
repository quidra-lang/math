name: infinity-checkpoint-import
# Temporary transport; the verified source tree removes this workflow.
on:
  push:
    branches: [develop]
    paths: [.github/workflows/infinity-checkpoint-import.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'quidra-lang/math'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare and verify immutable source tree
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_BLOBS: 2415b7985c5b1f34a23a6a70a71fb6ac1e8da04e
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tempfile, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          workflow = '.github/workflows/infinity-checkpoint-import.yml'
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(method, path, value=None):
              body = None if value is None else json.dumps(value).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=body, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          sha = os.environ['PAYLOAD_BLOBS']
          item = api('GET', 'git/blobs/' + sha)
          assert item['encoding'] == 'base64'
          raw = base64.b64decode(item['content'])
          assert blob_hash(raw) == sha, 'Transport hash mismatch'
          payload = json.loads(lzma.decompress(raw))
          commit = api('GET', 'git/commits/' + head)
          assert len(commit['parents']) == 1 and commit['parents'][0]['sha'] == payload['baseline'], 'Base moved before staging'
          assert api('GET', 'git/ref/heads/develop')['object']['sha'] == head, 'Develop moved; do not overwrite'
          for item in payload['files']:
              path = pathlib.PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8') as patch:
              patch.write(payload['patch']); patch.flush()
              subprocess.run(['git', 'apply', '--check', patch.name], check=True)
              subprocess.run(['git', 'apply', '--index', patch.name], check=True)
          paths = [item['path'] for item in payload['files']]
          assert set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()) == set(paths), 'Unexpected source changes'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          elements = []
          for item in payload['files']:
              data = pathlib.Path(item['path']).read_bytes()
              assert blob_hash(data) == item['sha'], 'Checkpoint mismatch: ' + item['path']
              created = api('POST', 'git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert created['sha'] == item['sha']
              elements.append({'path': item['path'], 'mode': item['mode'], 'type': 'blob', 'sha': item['sha']})
          elements.append({'path': workflow, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', 'git/trees', {'base_tree': commit['tree']['sha'], 'tree': elements})
          subprocess.run(['git', 'rm', '--cached', '--', workflow], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == tree['sha'], 'Remote tree differs from verified local tree'
          report = {'repository': repo, 'parent': head, 'baseline': payload['baseline'], 'tree': tree['sha'], 'file_count': len(paths), 'files': paths, 'status': 'checkpoint bytes verified; full integration not completed'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'infinity-tree.json').write_text(json.dumps(report, indent=2))
          print('INFINITY_IMPORT_RESULT=' + json.dumps(report), flush=True)
          # Only immutable objects are created. The connector updates develop with a lease.
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-prepared-tree
          path: ${{ runner.temp }}/infinity-tree.json
          if-no-files-found: error
          retention-days: 1
